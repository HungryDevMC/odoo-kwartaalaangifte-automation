# End-to-end UBL import testing with Odoo
# Usage:
#   python test_e2e_import.py --ci                    # Full CI run with Odoo 17
#   ODOO_VERSION=18 python test_e2e_import.py --ci    # Test with Odoo 18
#   python test_e2e_import.py --ci --odoo-version 16  # Test with Odoo 16

services:
  odoo:
    image: odoo:${ODOO_VERSION:-17}
    container_name: ubl-test-odoo-${ODOO_VERSION:-17}
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/database/selector"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  odoo-db:
    image: postgres:15
    container_name: ubl-test-odoo-db-${ODOO_VERSION:-17}
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  odoo-data:
  odoo-db-data:
