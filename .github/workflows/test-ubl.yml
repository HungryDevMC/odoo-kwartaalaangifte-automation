name: UBL E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'lambda-export/**'
      - '.github/workflows/test-ubl.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'lambda-export/**'
      - '.github/workflows/test-ubl.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda-export

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: lambda-export/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest test_edge_cases.py test_version_compatibility.py -v --tb=short

  e2e-tests:
    name: E2E Import Tests (Odoo ${{ matrix.odoo-version }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        # Note: Odoo 15 lacks public API for UBL import (create_document_from_attachment)
        # UBL files are still valid and can be imported via Odoo 15 web UI
        odoo-version: ['16', '17', '18']
    defaults:
      run:
        working-directory: lambda-export

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: lambda-export/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E tests (Odoo ${{ matrix.odoo-version }})
        run: python test_e2e_import.py --ci --odoo-version ${{ matrix.odoo-version }}
        timeout-minutes: 10
